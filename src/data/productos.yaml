# ─────────────────────────────────────────────────────────────
#  Productos de El Rinconcito de Salo — CATÁLOGO DE RESPALDO
#  ⚠️ Mientras Supabase esté conectado, los productos se editan en el panel /admin
#     y este archivo NO se usa (ver GUIA-PRODUCTOS.md).
#  Para agregar uno, copia un bloque completo (desde "- id:") y cambia los datos.
#
#  id          → nombre corto sin espacios ni tildes (se usa en el enlace)
#  categoria   → mascarillas | cuidado-facial | labios | maquillaje | accesorios
#  precio      → en pesos, sin puntos (5000 = $5.000)
#  precioAntes → opcional, para mostrar descuento
#  imagen      → archivo dentro de public/productos/ (.jpg, .png, .webp o .svg)
#  color       → fondo de la tarjeta: rosa | menta | lavanda | durazno
#  etiqueta    → opcional: nuevo | favorito | oferta
#  disponible  → false para mostrarlo como agotado
#
#  Los productos y precios de abajo son de EJEMPLO. Reemplázalos por los reales.
# ─────────────────────────────────────────────────────────────

