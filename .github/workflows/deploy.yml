name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Botón "Publicar cambios" del panel /admin (vía la función "publicar" de Supabase)
  repository_dispatch:
    types: [publicar]
  workflow_dispatch:
  # Diario 6:17 a. m. Colombia: refresca stock/precios y mantiene activo Supabase
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Construir el sitio
        run: npm run build
        env:
          # Detecta solo si el sitio vive en usuario.github.io/repo o en un dominio propio
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Base de datos (opcional). Sin estas variables se usa src/data/productos.yaml
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
